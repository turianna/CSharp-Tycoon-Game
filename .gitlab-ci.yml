image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - test
  - deploy

include:
  
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - component: szofttech.inf.elte.hu/components/code-quality-dotnet/windows@2
    inputs:
      check_path: "SpongeBobTycoon0303/SpongeBobTycoon" 
variables:
  GITLAB_ADVANCED_SAST_ENABLED: true

build_model:
  stage: build
  before_script:
    - dotnet --version
  script:
    - dotnet build SpongeBobTycoon0303/SpongeBobTycoon/SpongeBobTycoon
    
build_view:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0-windowsservercore-ltsc2025
  tags: [windows]
  before_script:
    - dotnet --version
  script:
    - dotnet build SpongeBobTycoon0303/SpongeBobTycoon/SpongeBobTycoonWPF

test_model:
  stage: test
  before_script:    
    - dotnet restore SpongeBobTycoon0303/SpongeBobTycoon/SpongeBobTycoonTest --packages .nuget
  script:
    # 1. ADD BOTH PACKAGES (Logger and Coverage Collector)
    - dotnet add SpongeBobTycoon0303/SpongeBobTycoon/SpongeBobTycoonTest package JUnitXml.TestLogger
    - dotnet add SpongeBobTycoon0303/SpongeBobTycoon/SpongeBobTycoonTest package coverlet.collector
    
    - > 
      dotnet test SpongeBobTycoon0303/SpongeBobTycoon/SpongeBobTycoonTest --no-restore
      --results-directory TestResults
      --logger:"junit;LogFileName=TestResults.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      --collect="XPlat Code Coverage"
    
    - ls -R TestResults 
    
    - apt-get update -yqq
    - apt-get install -yqq bc
    - dotnet tool install --tool-path . dotnet-reportgenerator-globaltool
    
    - ./reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:report" "-reporttypes:Cobertura"
    - ./reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:report/html" "-reporttypes:Html"
    
    - |
      if [ -f "./report/Cobertura.xml" ]; then
        line_rate=$(head -n 3 ./report/Cobertura.xml | sed 'N;N;s/.*line-rate="\([^" ]*\).*/\1/g')
        coverage=$(echo "${line_rate} * 100" | bc)
        printf "TOTAL_COVERAGE=%2.2f\n" "$coverage"
      else
        echo "Error: Cobertura.xml not found!"
        exit 1
      fi
